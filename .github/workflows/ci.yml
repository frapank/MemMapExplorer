name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: ${{ matrix.cxx }}
    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false
      matrix:
        cxx: [g++, clang++]

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y pkg-config libncurses-dev

      - name: Build
        run: make -j"$(nproc)" CXX=${{ matrix.cxx }}
